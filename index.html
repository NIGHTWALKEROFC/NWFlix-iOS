<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NWFlix iOS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#010314">
  <title>NWFlix iOS</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: #010314; color: #DFE1F4; }
    #splash { position: fixed; inset: 0; z-index: 99; background: #010314; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .5s; }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash img { width: 120px; height: 120px; border-radius: 28px; animation: pop 1s cubic-bezier(.2,.9,.3,1.2) both, glow 2s ease-in-out infinite 1s; }
    #splash b { font: 700 26px -apple-system, system-ui, sans-serif; letter-spacing: -.6px; animation: rise .8s .3s both; }
    #splash i { width: 120px; height: 3px; border-radius: 3px; background: #2A2B3A; overflow: hidden; position: relative; animation: rise .8s .5s both; }
    #splash i::after { content: ""; position: absolute; inset: 0; width: 40%; background: #B88CFF; border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 24px #6633EE55; } 50% { box-shadow: 0 0 56px #B88CFF88; } }
    @keyframes slide { from { left: -40%; } to { left: 100%; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icon.png" alt=""><b>NWFlix iOS</b><i></i></div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
